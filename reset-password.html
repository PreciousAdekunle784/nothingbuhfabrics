<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Password · Nothingbuh Fabrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="reset-password">
<main class="auth">
  <div class="auth-visual"><div class="swatch fab-brocade"></div><div class="cap"><span class="eyebrow" style="color:var(--gold-soft)">Nothingbuh Fabrics</span><h2 class="serif">Choose a new password.</h2></div></div>
  <div class="auth-form"><div class="auth-inner">
    <span class="eyebrow">Account</span><h1 class="serif">New Password</h1><p class="sub">Enter a new password for your account.</p>
    <div id="authMsg" class="hide"></div>
    <form onsubmit="return doReset(event)">
      <div class="field"><label>New password</label><input name="pw" id="resetPw" type="password" required><button type="button" class="toggle-pw" onclick="togglePw(this,'resetPw')">Show</button></div>
      <button type="submit" class="btn btn-dark btn-block">Update Password</button>
    </form>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script>
window.doReset = async function(e){ e.preventDefault(); var box=document.getElementById("authMsg");
  if(!window.sb){ box.className="msg err"; box.textContent="Connect Supabase to enable password reset."; box.classList.remove("hide"); return false; }
  var pw=e.target.pw.value; if(pw.length<6){ box.className="msg err"; box.textContent="Use at least 6 characters."; box.classList.remove("hide"); return false; }
  try{ var r=await sb.auth.updateUser({password:pw}); if(r.error){ box.className="msg err"; box.textContent=r.error.message; } else { box.className="msg ok"; box.textContent="Password updated. Redirecting to sign in…"; setTimeout(function(){location.href="/login";},1800); } box.classList.remove("hide"); }
  catch(err){ box.className="msg err"; box.textContent="Something went wrong."; box.classList.remove("hide"); } return false;
};
</script>
</body>
</html>
