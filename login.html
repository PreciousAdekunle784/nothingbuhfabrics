<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign In · Nothingbuh Fabrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="login">
<main class="auth">
  <div class="auth-visual"><div class="swatch fab-brocade"></div><div class="cap"><span class="eyebrow" style="color:var(--gold-soft)">Nothingbuh Fabrics</span><h2 class="serif">Welcome back to the house of beautiful fabric.</h2></div></div>
  <div class="auth-form"><div class="auth-inner">
    <span class="eyebrow">Account</span><h1 class="serif">Sign In</h1><p class="sub">Welcome back. Sign in to see your orders and wishlist.</p>
    <div id="authMsg" class="hide"></div>
    <form onsubmit="return doLogin(event)">
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="field"><label>Password</label><input name="password" id="loginPw" type="password" required><button type="button" class="toggle-pw" onclick="togglePw(this,'loginPw')">Show</button></div>
      <div class="auth-opts"><label><input type="checkbox" name="remember"> Remember me</label><a href="/forgot-password">Forgot password?</a></div>
      <button type="submit" class="btn btn-dark btn-block">Sign In</button>
    </form>
    <div class="divider">or</div>
    <button class="btn-google" onclick="return doGoogle()"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12c0-.7-.1-1.4-.2-2H12v4h5.6c-.2 1.3-1 2.4-2.1 3.1v2.6h3.4C20.8 17.9 22 15.2 22 12z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.4-2.6c-.9.6-2 .9-3.2.9-2.5 0-4.6-1.7-5.3-3.9H3.2v2.7C4.9 19.9 8.2 22 12 22z"/><path fill="#FBBC05" d="M6.7 13.9c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.4H3.2C2.4 8.8 2 10.4 2 12s.4 3.2 1.2 4.6l3.5-2.7z"/><path fill="#EA4335" d="M12 6.1c1.4 0 2.7.5 3.6 1.5l2.7-2.7C16.9 3.4 14.7 2.5 12 2.5 8.2 2.5 4.9 4.6 3.2 7.4l3.5 2.7C7.4 7.8 9.5 6.1 12 6.1z"/></svg>Continue with Google</button>
    <p class="auth-alt">New here? <a href="/register">Create an account</a></p>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
