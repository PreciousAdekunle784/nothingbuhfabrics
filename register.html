<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Create Account · Nothingbuh Fabrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="register">
<main class="auth">
  <div class="auth-visual"><div class="swatch fab-brocade"></div><div class="cap"><span class="eyebrow" style="color:var(--gold-soft)">Nothingbuh Fabrics</span><h2 class="serif">Join us — fabric worthy of the occasion.</h2></div></div>
  <div class="auth-form"><div class="auth-inner">
    <span class="eyebrow">Account</span><h1 class="serif">Create Account</h1><p class="sub">Save your details, track orders and build a wishlist.</p>
    <div id="authMsg" class="hide"></div>
    <form onsubmit="return doRegister(event)">
      <div class="field"><label>Full name</label><input name="full_name" required></div>
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="field"><label>Phone number</label><input name="phone" type="tel" required></div>
      <div class="field"><label>Password</label><input name="password" id="regPw" type="password" required><button type="button" class="toggle-pw" onclick="togglePw(this,'regPw')">Show</button></div>
      <div class="field"><label>Confirm password</label><input name="confirm" type="password" required></div>
      <button type="submit" class="btn btn-dark btn-block">Create Account</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
